name: Automated 24/7 Cron Tick & Keep-Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render 15-minute inactivity sleep and execute due scrapes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab if needed

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Backend Cron Tick
        run: |
          echo "Sending heartbeat & scheduler tick to Render backend..."
          RESPONSE=$(curl -s -X POST https://tagscrape.onrender.com/api/cron/tick)
          echo "Backend Response: $RESPONSE"
